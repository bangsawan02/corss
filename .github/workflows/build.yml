name: Run Alpine IceWM with Free Cloudflare & SSH Tunnel

on:
  push:
  workflow_dispatch:

jobs:
  desktop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local data directory
        run: mkdir -p ${{ github.workspace }}/persistent-data

      # 1. Restore Cache
      - name: Restore persistent data cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}
          restore-keys: |
            desktop-data-

      # 2. Fix Permission & Cleanup
      - name: Fix Cache Permissions & Clean Locks
        run: |
          sudo chown -R 1000:1000 ${{ github.workspace }}/persistent-data
          sudo chmod -R 777 ${{ github.workspace }}/persistent-data
          sudo rm -rf ${{ github.workspace }}/persistent-data/.X11-unix
          sudo rm -f ${{ github.workspace }}/persistent-data/*.lock
          sudo rm -f ${{ github.workspace }}/persistent-data/*.pid

      # 3. Setup Container Alpine, Install Git & Setup SSH Server
      - name: Setup Alpine IceWM, Git & SSH
        run: |
          docker run -d --name alpine-desktop \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Asia/Jakarta \
            -v ${{ github.workspace }}/persistent-data:/config \
            -p 3000:3000 \
            -p 2222:22 \
            --shm-size="1gb" \
            lscr.io/linuxserver/webtop:alpine-icewm

          echo "Menunggu WebTop aktif di port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "WebTop SIAP!"
              break
            fi
            sleep 2
          done

          echo "Menginstal Git & OpenSSH Server..."
          docker exec alpine-desktop apk add --no-cache git openssh
          docker exec alpine-desktop ssh-keygen -A

          # Set password untuk user 'root' & 'abc' menjadi: 123456
          docker exec alpine-desktop sh -c "echo 'root:123456' | chpasswd"
          docker exec alpine-desktop sh -c "echo 'abc:123456' | chpasswd"
          docker exec alpine-desktop sh -c "sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config"
          
          # Jalankan SSH Daemon
          docker exec alpine-desktop /usr/sbin/sshd

      # 4. Jalankan Cloudflare Web Tunnel & SSH Tunnel (localhost.run)
      - name: Start Tunnels (Web & SSH)
        run: |
          # Generate SSH Key untuk Runner GitHub agar localhost.run bisa diautentikasi
          mkdir -p ~/.ssh
          [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""

          # A. Web Tunnel via Cloudflare
          docker run -d --network host --name cloudflared-tunnel cloudflare/cloudflared:latest tunnel --url http://localhost:3000 --http-host-header="localhost:3000"

          # B. SSH Tunnel via localhost.run (Gunakan port 0 untuk TCP Forwarding)
          ssh -o StrictHostKeyChecking=no -R 0:localhost:2222 nokey@localhost.run > ssh_tunnel.log 2>&1 &

          echo "Menunggu URL Tunnels..."
          
          # Get Cloudflare Web URL
          WEB_URL=""
          for i in {1..20}; do
            WEB_URL=$(docker logs cloudflared-tunnel 2>&1 | grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' | head -n 1)
            [ -n "$WEB_URL" ] && break
            sleep 1
          done

          # Get SSH Command
          SSH_CMD=""
          for i in {1..20}; do
            SSH_CMD=$(grep -E 'ssh -p [0-9]+' ssh_tunnel.log | head -n 1 || true)
            [ -n "$SSH_CMD" ] && break
            sleep 1
          done

          if [ -n "$SSH_CMD" ]; then
            CLEAN_SSH=$(echo "$SSH_CMD" | sed 's/nokey@/root@/')
          else
            CLEAN_SSH="Gagal mengambil perintah SSH. Log:"
            cat ssh_tunnel.log || true
          fi

          # Cetak LANGSUNG ke Konsol Log
          echo "=================================================="
          echo "🌐 LINK DESKTOP: $WEB_URL"
          echo "🔑 PERINTAH SSH: $CLEAN_SSH"
          echo "=================================================="

          # Tuliskan juga ke GitHub Step Summary
          echo "## 🚀 Alpine IceWM Workspace Ready" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Web Desktop" >> $GITHUB_STEP_SUMMARY
          echo "[👉 KLIK DI SINI UNTUK MEMBUKA DESKTOP]($WEB_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 SSH Terminal Access" >> $GITHUB_STEP_SUMMARY
          echo "Gunakan perintah di bawah ini di Termux / Terminal kamu:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "$CLEAN_SSH" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "**Password SSH:** \`123456\`" >> $GITHUB_STEP_SUMMARY

      # 5. Keep Alive
      - name: Keep Alive
        run: |
          echo "Workflow berjalan. Cek link Desktop & SSH di layar log atau halaman Summary."
          sleep 3600

      # 6. Fix permissions
      - name: Fix permissions for persistent data
        if: always()
        run: sudo chmod -R 777 ${{ github.workspace }}/persistent-data

      # 7. Simpan Cache
      - name: Save persistent data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}

      # 8. Upload Artifacts
      - name: Save data via Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-desktop-data
          path: ${{ github.workspace }}/persistent-data/
