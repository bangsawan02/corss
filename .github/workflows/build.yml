name: Run Alpine IceWM with Free Cloudflare & SSH Tunnel

on:
  push:
  workflow_dispatch:

jobs:
  desktop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local data directory
        run: mkdir -p ${{ github.workspace }}/persistent-data

      # 1. Restore Cache
      - name: Restore persistent data cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}
          restore-keys: |
            desktop-data-

      # 2. Fix Permission & Cleanup
      - name: Fix Cache Permissions & Clean Locks
        run: |
          sudo chown -R 1000:1000 ${{ github.workspace }}/persistent-data
          sudo chmod -R 777 ${{ github.workspace }}/persistent-data
          sudo rm -rf ${{ github.workspace }}/persistent-data/.X11-unix
          sudo rm -f ${{ github.workspace }}/persistent-data/*.lock
          sudo rm -f ${{ github.workspace }}/persistent-data/*.pid

      # 3. Setup Container Alpine & Install Git
      - name: Setup Alpine IceWM & Git
        run: |
          docker run -d --name alpine-desktop \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Asia/Jakarta \
            -v ${{ github.workspace }}/persistent-data:/config \
            -p 3000:3000 \
            --shm-size="1gb" \
            lscr.io/linuxserver/webtop:alpine-icewm

          echo "Menunggu WebTop aktif di port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "WebTop SIAP!"
              break
            fi
            sleep 2
          done

          echo "Menginstal Git..."
          docker exec alpine-desktop apk add --no-cache git

      # 4. Jalankan Tunnels (Cloudflare Web & Tmate SSH)
      - name: Start Tunnels
        run: |
          # A. Web Tunnel via Cloudflare
          docker run -d --network host --name cloudflared-tunnel cloudflare/cloudflared:latest tunnel --url http://localhost:3000 --http-host-header="localhost:3000"

          # B. SSH Terminal via Tmate
          echo "Menyiapkan SSH Tunnel (Tmate)..."
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -y tmate > /dev/null 2>&1
          
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')

          # Get Cloudflare Web URL
          echo "Menunggu URL Cloudflare..."
          WEB_URL=""
          for i in {1..20}; do
            WEB_URL=$(docker logs cloudflared-tunnel 2>&1 | grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' | head -n 1)
            [ -n "$WEB_URL" ] && break
            sleep 1
          done

          # Cetak LANGSUNG ke Konsol Log
          echo "=================================================="
          echo "🌐 LINK DESKTOP: $WEB_URL"
          echo "🔑 PERINTAH SSH: $SSH_CMD"
          echo "=================================================="

          # Tuliskan juga ke GitHub Step Summary
          echo "## 🚀 Alpine IceWM Workspace Ready" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Web Desktop" >> $GITHUB_STEP_SUMMARY
          echo "[👉 KLIK DI SINI UNTUK MEMBUKA DESKTOP]($WEB_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 SSH Terminal Access" >> $GITHUB_STEP_SUMMARY
          echo "Gunakan perintah di bawah ini di Termux / Terminal kamu (Tanpa Password):" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "$SSH_CMD" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "> **💡 PENTING:** Setelah masuk via SSH, ketik perintah ini untuk masuk ke dalam Alpine:" >> $GITHUB_STEP_SUMMARY
          echo "> \`docker exec -it alpine-desktop sh\`" >> $GITHUB_STEP_SUMMARY

      # 5. Keep Alive
      - name: Keep Alive
        run: |
          echo "Workflow berjalan. Cek link Desktop & SSH di layar log atau halaman Summary."
          sleep 18000

      # 6. Fix permissions
      - name: Fix permissions for persistent data
        if: always()
        run: sudo chmod -R 777 ${{ github.workspace }}/persistent-data

      # 7. Simpan Cache
      - name: Save persistent data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}

      # 8. Upload Artifacts
      - name: Save data via Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-desktop-data
          path: ${{ github.workspace }}/persistent-data/
