name: Run Alpine IceWM with Free Cloudflare Tunnel

on:
  push:
  workflow_dispatch:

jobs:
  desktop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local data directory
        run: mkdir -p ${{ github.workspace }}/persistent-data

      # 1. Restore Cache
      - name: Restore persistent data cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}
          restore-keys: |
            desktop-data-

      # 2. PERBAIKAN PERMISSION & CLEANUP DINI (Mencegah 502)
      - name: Fix Cache Permissions & Clean Locks
        run: |
          # Berikan hak milik ke PUID/PGID 1000 (User WebTop)
          sudo chown -R 1000:1000 ${{ github.workspace }}/persistent-data
          sudo chmod -R 777 ${{ github.workspace }}/persistent-data
          
          # Hapus file sisa sesi sebelumnya
          sudo rm -rf ${{ github.workspace }}/persistent-data/.X11-unix
          sudo rm -f ${{ github.workspace }}/persistent-data/*.lock
          sudo rm -f ${{ github.workspace }}/persistent-data/*.pid

      # 3. Setup Container Alpine IceWM & Install Git
      - name: Setup Alpine IceWM & Git
        run: |
          docker run -d --name alpine-desktop \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Asia/Jakarta \
            -v ${{ github.workspace }}/persistent-data:/config \
            -p 3000:3000 \
            --shm-size="1gb" \
            lscr.io/linuxserver/webtop:alpine-icewm

          # Healthcheck: Tunggu sampai port 3000 benar-benar MERESPONS (Max 60 detik)
          echo "Menunggu WebTop aktif di port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "WebTop SIAP dan merespons di port 3000!"
              break
            fi
            sleep 2
          done

          # Install Git secara otomatis
          echo "Menginstal Git..."
          docker exec alpine-desktop apk add --no-cache git

      # 4. Jalankan Tunnel HANYA SETELAH WebTop SIAP
      - name: Start Cloudflare Tunnel
        run: |
          docker run -d --network host --name cloudflared-tunnel cloudflare/cloudflared:latest tunnel --url http://localhost:3000 --http-host-header="localhost:3000"

          echo "Menunggu URL Cloudflare..."
          for i in {1..20}; do
            URL=$(docker logs cloudflared-tunnel 2>&1 | grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' | head -n 1)
            if [ -n "$URL" ]; then
              # Tulis ke Summary
              echo "## 🚀 Alpine IceWM Desktop Ready" >> $GITHUB_STEP_SUMMARY
              echo "### [👉 KLIK DI SINI UNTUK MEMBUKA DESKTOP]($URL)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**URL Direct:** \`$URL\`" >> $GITHUB_STEP_SUMMARY
              
              echo "::notice title=LINK DESKTOP::$URL"
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            docker logs cloudflared-tunnel
            exit 1
          fi

      # 5. Keep Alive
      - name: Keep Alive
        run: |
          echo "Workflow berjalan. Silakan cek link di halaman Summary."
          sleep 3600

      # 6. Fix permissions sebelum menyimpan
      - name: Fix permissions for persistent data
        if: always()
        run: sudo chmod -R 777 ${{ github.workspace }}/persistent-data

      # 7. Simpan Cache
      - name: Save persistent data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}

      # 8. Upload Artifacts
      - name: Save data via Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-desktop-data
          path: ${{ github.workspace }}/persistent-data/
