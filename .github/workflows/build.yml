name: Run Alpine IceWM with Free Cloudflare Tunnel

on:
  push:
  workflow_dispatch:

jobs:
  desktop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local data directory
        run: mkdir -p ${{ github.workspace }}/persistent-data

      # 1. Restore Cache
      - name: Restore persistent data cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}
          restore-keys: |
            desktop-data-

      # 2. Bersihkan file temporary / lock file
      - name: Clean stale lock files from cache
        run: |
          sudo rm -rf ${{ github.workspace }}/persistent-data/.X11-unix
          sudo rm -f ${{ github.workspace }}/persistent-data/*.lock
          sudo rm -f ${{ github.workspace }}/persistent-data/*.pid

      # 3. Setup Container & Download Cloudflared
      - name: Setup Alpine IceWM & Download Cloudflared
        run: |
          # Download cloudflared ke folder persistent-data agar bisa diakses container
          sudo curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o ${{ github.workspace }}/persistent-data/cloudflared
          sudo chmod +x ${{ github.workspace }}/persistent-data/cloudflared

          # Jalankan Container Alpine IceWM
          docker run -d --name alpine-desktop \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Asia/Jakarta \
            -v ${{ github.workspace }}/persistent-data:/config \
            -p 3000:3000 \
            --shm-size="1gb" \
            lscr.io/linuxserver/webtop:alpine-icewm

      # 4. Jalankan Tunnel di dalam Docker & Buat Summary (Selesai Cepat)
      - name: Get Tunnel URL
        run: |
          # Jalankan cloudflared di dalam Docker agar tidak terbunuh saat step selesai
          docker exec -d alpine-desktop sh -c "/config/cloudflared tunnel --url http://localhost:3000 --http-host-header='localhost:3000' > /config/cloudflare.log 2>&1"

          echo "Menunggu URL Cloudflare..."
          for i in {1..20}; do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' ${{ github.workspace }}/persistent-data/cloudflare.log || true)
            if [ -n "$URL" ]; then
              # Tulis ke Summary
              echo "## 🚀 Alpine IceWM Desktop Ready" >> $GITHUB_STEP_SUMMARY
              echo "### [👉 KLIK DI SINI UNTUK MEMBUKA DESKTOP]($URL)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**URL Direct:** \`$URL\`" >> $GITHUB_STEP_SUMMARY
              echo "::notice title=LINK DESKTOP::$URL"
              break
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            cat ${{ github.workspace }}/persistent-data/cloudflare.log
            exit 1
          fi

      # 5. Keep Alive (Step terpisah agar tidak menahan perenderan Summary)
      - name: Keep Alive
        run: |
          echo "Workflow berjalan. Silakan cek link di halaman Summary."
          sleep 3600

      # 6. Fix permissions
      - name: Fix permissions for persistent data
        if: always()
        run: sudo chmod -R 777 ${{ github.workspace }}/persistent-data

      # 7. Simpan Cache
      - name: Save persistent data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}

      # 8. Upload Artifacts
      - name: Save data via Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-desktop-data
          path: ${{ github.workspace }}/persistent-data/
