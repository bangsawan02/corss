name: Run Firefox noVNC with Cloudflare Quick Tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-browser:
    runs-on: ubuntu-latest

    env:
      FIREFOX_DATA: ${{ github.workspace }}/firefox_data
      FIREFOX_PORT: 3001
      CACHE_KEY: firefox-profile-${{ github.repository }}-${{ github.ref_name }}-${{ github.run_id }}

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Siapkan direktori Firefox
      # ============================================================
      - name: Siapkan Folder Firefox
        shell: bash
        run: |
          set -e

          mkdir -p "$FIREFOX_DATA"

          # Container LinuxServer akan menulis ke /config
          chmod 777 "$FIREFOX_DATA"

          echo "Firefox data directory:"
          ls -ld "$FIREFOX_DATA"

      # ============================================================
      # 3. Restore cache Firefox profile
      # ============================================================
      - name: Pulihkan Firefox Profile dari Cache
        uses: actions/cache/restore@v4
        with:
          path: ./firefox_data
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            firefox-profile-${{ github.repository }}-${{ github.ref_name }}-
            firefox-profile-${{ github.repository }}-

      # ============================================================
      # 4. Pull image Firefox
      # ============================================================
      - name: Pull Firefox Docker Image
        shell: bash
        run: |
          set -e

          docker pull lscr.io/linuxserver/firefox:latest

      # ============================================================
      # 5. Jalankan Firefox noVNC
      # ============================================================
      - name: Jalankan Firefox noVNC
        shell: bash
        run: |
          set -e

          # Bersihkan container lama kalau ada
          docker rm -f firefox-novnc 2>/dev/null || true

          PUID="$(id -u)"
          PGID="$(id -g)"

          echo "PUID=$PUID"
          echo "PGID=$PGID"

          docker run -d \
            --name firefox-novnc \
            -p ${FIREFOX_PORT}:3001 \
            -v "$FIREFOX_DATA:/config" \
            -e PUID="$PUID" \
            -e PGID="$PGID" \
            -e TZ=Asia/Jakarta \
            --shm-size=2g \
            lscr.io/linuxserver/firefox:latest

          echo
          echo "Menunggu Firefox siap..."

          for i in {1..30}; do
            if curl -k -fsS "https://127.0.0.1:${FIREFOX_PORT}/" >/dev/null 2>&1; then
              echo "Firefox sudah siap."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Firefox gagal start."
              echo
              echo "=== DOCKER STATUS ==="
              docker ps -a
              echo
              echo "=== FIREFOX LOG ==="
              docker logs firefox-novnc
              exit 1
            fi

            sleep 2
          done

          echo
          echo "=== FIREFOX CONTAINER ==="
          docker ps --filter name=firefox-novnc

      # ============================================================
      # 6. Install cloudflared terbaru
      # ============================================================
      - name: Install Cloudflared
        shell: bash
        run: |
          set -e

          ARCH="$(dpkg --print-architecture)"

          echo "Architecture: $ARCH"

          curl --fail --location \
            --output cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${ARCH}.deb"

          sudo dpkg -i cloudflared.deb

          echo
          cloudflared --version

      # ============================================================
      # 7. Jalankan Cloudflare Quick Tunnel
      # ============================================================
      - name: Jalankan Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -e

          rm -f cloudflare.log

          echo "Memulai Cloudflare Quick Tunnel..."

          nohup cloudflared tunnel \
            --url "https://127.0.0.1:${FIREFOX_PORT}" \
            --no-tls-verify \
            --protocol http2 \
            > cloudflare.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "cloudflared PID: $CLOUDFLARED_PID"

          echo
          echo "Menunggu URL tunnel..."

          TUNNEL_URL=""

          for i in {1..30}; do
            if [ -f cloudflare.log ]; then
              TUNNEL_URL="$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cloudflare.log | head -n 1 || true)"
            fi

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            sleep 2
          done

          echo
          echo "=============================================="
          echo "       FIREFOX NOVNC CLOUDFLARE URL"
          echo "=============================================="

          if [ -n "$TUNNEL_URL" ]; then
            echo
            echo "$TUNNEL_URL"
            echo
          else
            echo "URL tunnel belum ditemukan."
            echo
            echo "=== CLOUDFLARED LOG ==="
            cat cloudflare.log || true
            exit 1
          fi

          echo "=============================================="

          echo
          echo "=== CLOUDFLARED STATUS ==="
          ps -p "$CLOUDFLARED_PID" -o pid,cmd || true

      # ============================================================
      # 8. Tampilkan status untuk debugging
      # ============================================================
      - name: Status Firefox
        shell: bash
        run: |
          echo "=== Docker Containers ==="
          docker ps -a

          echo
          echo "=== Firefox Logs ==="
          docker logs --tail 100 firefox-novnc || true

          echo
          echo "=== Cloudflare Log ==="
          cat cloudflare.log || true

      # ============================================================
      # 9. Tahan runner
      # ============================================================
      - name: Jalankan Session
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " Firefox sedang berjalan melalui Cloudflare"
          echo "=============================================="
          echo
          echo "Workflow akan tetap aktif selama 5 jam."
          echo "Jangan hentikan workflow jika session masih dipakai."
          echo

          sleep 18000

      # ============================================================
      # 10. Simpan profile Firefox
      # ============================================================
      - name: Simpan Firefox Profile ke Cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ./firefox_data
          key: ${{ env.CACHE_KEY }}

      # ============================================================
      # 11. Cleanup
      # ============================================================
      - name: Cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm -f firefox-novnc 2>/dev/null || true
          pkill -f cloudflared 2>/dev/null || true
```
