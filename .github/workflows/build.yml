name: Run Alpine IceWM with Free Cloudflare Tunnel

on:
  push:
  workflow_dispatch:

jobs:
  desktop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create local data directory
        run: mkdir -p ${{ github.workspace }}/persistent-data

      # 1. Restore Cache
      - name: Restore persistent data cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}
          restore-keys: |
            desktop-data-

      # 2. Bersihkan file temporary / lock file bekas run sebelumnya
      - name: Clean stale lock files from cache
        run: |
          sudo rm -rf ${{ github.workspace }}/persistent-data/.X11-unix
          sudo rm -f ${{ github.workspace }}/persistent-data/*.lock
          sudo rm -f ${{ github.workspace }}/persistent-data/*.pid

      # 3. Setup Cloudflared & Run Container
      - name: Setup Cloudflared & Run Alpine IceWM
        run: |
          # Download binary cloudflared
          sudo curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          # Jalankan Container Alpine IceWM
          docker run -d --name alpine-desktop \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Asia/Jakarta \
            -v ${{ github.workspace }}/persistent-data:/config \
            -p 3000:3000 \
            --shm-size="1gb" \
            lscr.io/linuxserver/webtop:alpine-icewm

      # 4. Jalankan Tunnel & Tampilkan Link di Halaman Summary GitHub
      - name: Start Quick Tunnel and Keep Alive
        run: |
          # Jalankan tunnel di background
          cloudflared tunnel --url http://localhost:3000 --http-host-header="localhost:3000" > cloudflare.log 2>&1 &

          # Polling loop: Cek log sampai link muncul
          echo "Menunggu URL Cloudflare..."
          for i in {1..20}; do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cloudflare.log || true)
            if [ -n "$URL" ]; then
              # Write to GitHub Step Summary (Tampil di halaman Summary utama GitHub)
              echo "## 🚀 Alpine IceWM Desktop Ready" >> $GITHUB_STEP_SUMMARY
              echo "### [👉 Klik di sini untuk membuka Desktop]($URL)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "URL Direct: \`$URL\`" >> $GITHUB_STEP_SUMMARY
              
              # Buat notifikasi khusus
              echo "::notice title=LINK DESKTOP::$URL"
              break
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            cat cloudflare.log
            exit 1
          fi

          # Tahan proses agar tunnel tidak mati
          echo "Workflow berjalan. Akses link melalui tab Summary di atas."
          sleep 3600

      # 5. Fix permissions sebelum menyimpan
      - name: Fix permissions for persistent data
        if: always()
        run: sudo chmod -R 777 ${{ github.workspace }}/persistent-data

      # 6. Simpan Cache
      - name: Save persistent data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/persistent-data
          key: desktop-data-${{ github.run_id }}

      # 7. Upload Artifacts
      - name: Save data via Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-desktop-data
          path: ${{ github.workspace }}/persistent-data/
